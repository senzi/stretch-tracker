<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLEX//OS · 证据与文献 EVIDENCE</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,"Courier New",monospace;
  --font-disp:"Arial Black","Helvetica Neue",sans-serif;
}
[data-theme="dark"]{
  --bg:#0a0a0b; --bg2:#111113; --bg3:#18181b;
  --line:#2a2a2e; --line2:#3a3a40;
  --tx:#e8e8ea; --tx2:#9a9aa2; --tx3:#5c5c66;
  --acc:#ffffff; --acc-inv:#0a0a0b;
  --glow:rgba(255,255,255,.08);
  --grid:rgba(255,255,255,.035);
  --shadow:rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f2f2f3; --bg2:#ffffff; --bg3:#e8e8ea;
  --line:#d0d0d4; --line2:#b8b8c0;
  --tx:#121214; --tx2:#55555e; --tx3:#8a8a92;
  --acc:#111113; --acc-inv:#ffffff;
  --glow:rgba(0,0,0,.05);
  --grid:rgba(0,0,0,.05);
  --shadow:rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--tx); font-family:var(--font-mono);
  min-height:100vh;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
}
::selection{background:var(--acc);color:var(--acc-inv)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 90px}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hd-in{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:15px}
.logo .dot{width:10px;height:10px;background:var(--acc);box-shadow:0 0 12px var(--glow),0 0 4px var(--acc);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.logo small{font-weight:400;color:var(--tx3);letter-spacing:.2em;font-size:10px}
.hd-sp{flex:1}
.btn{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;cursor:pointer;
  background:var(--bg2);color:var(--tx);border:1px solid var(--line2);
  padding:8px 13px;text-transform:uppercase;transition:all .18s;user-select:none;text-decoration:none;
}
.btn:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 14px var(--glow)}
.hero{padding:40px 0 26px;text-align:center}
.hero h1{font-family:var(--font-disp);font-size:clamp(26px,5vw,44px);letter-spacing:.04em}
.hero p{font-size:11px;color:var(--tx3);letter-spacing:.22em;margin-top:8px;text-transform:uppercase}
.verdict{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:22px 0;
}
.v-cell{background:var(--bg2);padding:18px 16px}
.v-cell .v-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.v-mark{font-size:16px;letter-spacing:0}
.v-tag{font-size:10px;color:var(--tx2);letter-spacing:.18em}
.v-q{font-size:12px;font-weight:700;letter-spacing:.03em;margin-bottom:6px}
.v-c{font-size:11px;color:var(--tx2);line-height:1.7}
.card{background:var(--bg2);border:1px solid var(--line);margin:22px 0;box-shadow:0 10px 40px var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.22em;color:var(--tx2);text-transform:uppercase}
.ref{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.ref:last-child{border-bottom:none}
.ref:hover{background:var(--glow)}
.ref-idx{flex:none;font-size:10px;color:var(--tx3);letter-spacing:.1em;margin-top:3px;width:26px}
.ref-body{flex:1;min-width:0}
.ref-title{font-size:12px;line-height:1.5;color:var(--tx)}
.ref-meta{display:block;margin-top:3px;font-size:10px;color:var(--tx3);letter-spacing:.04em}
.ref-links{margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.ref-links a{font-size:10px;color:var(--tx2);letter-spacing:.08em;text-decoration:none;border-bottom:1px dashed var(--line2);padding-bottom:1px}
.ref-links a:hover{color:var(--acc);border-color:var(--acc)}
.grp-tag{display:inline-block;font-size:9px;color:var(--tx3);border:1px solid var(--line2);padding:2px 8px;letter-spacing:.14em;margin-top:2px}
.sug{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}
.sug:last-child{border-bottom:none}
.sug .n{flex:none;font-size:10px;color:var(--tx3);margin-top:4px;width:20px}
.note{font-size:10px;color:var(--tx3);line-height:1.9;letter-spacing:.04em;padding:12px 18px}
footer{text-align:center;font-size:10px;color:var(--tx3);letter-spacing:.24em;margin-top:56px;text-transform:uppercase;line-height:2}
footer a{color:var(--tx3);text-decoration:none}
footer a:hover{color:var(--acc)}
@media(max-width:640px){
  .hero h1{font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="hd-in">
    <div class="logo"><span class="dot"></span>FLEX//OS <small>EVIDENCE · 证据与文献</small></div>
    <div class="hd-sp"></div>
    <button class="btn" id="btn-theme">◐ 昼夜</button>
    <a class="btn" href="index.html" target="_blank" rel="noopener">⇦ 返回训练</a>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>循证核查 EVIDENCE REVIEW</h1>
    <p>2026-08-07 · PubMed 分层检索 + OpenAlex 计量 · 16 篇纳入</p>
  </div>

  <div class="verdict" id="verdicts"></div>

  <div class="card">
    <div class="card-hd"><span>▸ 计划核心引用 CORE</span><span>5 篇</span></div>
    <div id="core-refs"></div>
  </div>

  <div class="card">
    <div class="card-hd"><span>▸ 循证纳入文献 EVIDENCE POOL</span><span>16 篇</span></div>
    <div id="ev-refs"></div>
  </div>

  <div class="card">
    <div class="card-hd"><span>▸ 可执行建议 ACTION</span><span>对训练计划</span></div>
    <div id="actions"></div>
  </div>

  <div class="card">
    <div class="card-hd"><span>▸ 局限性 LIMITS</span></div>
    <div class="note" id="limits"></div>
  </div>

  <footer>FLEX//OS · 数据仅存于本浏览器 localStorage<br>证据报告基于 PubMed/OpenAlex 检索快照 · 不构成医疗建议</footer>
</div>

<script>
const VERDICTS=[
 {mark:"✅",tag:"【中】",q:"① 测量可信吗？",c:"sit-and-reach 对腘绳肌效度中等（rp 0.46-0.67），跟踪相对进步完全够用；你量的是腘绳肌+少量下背的复合指标，不等于全身柔韧性。"},
 {mark:"⚠️",tag:"【中偏弱】",q:"② PNF 比其他方法强吗？",c:"急性效应各方法无差异（大 Meta P=0.72）；PNF 优势只在短期/康复人群成立。你选 PNF 没错，但别迷信\"秒杀静态\"——静态才是主力。"},
 {mark:"✅",tag:"【中】",q:"③ 剂量对吗？",c:"每周每部位约10分钟有依据（Ingram 2025 + 剂量亚组）；30秒×3组=90秒/部位/日在证据区间内。每天练与每周数次均有效。"},
 {mark:"✅",tag:"【中】",q:"④ 拉伸有损伤风险吗？",c:"常规拉伸不显著增加损伤风险；但防伤主力是力量训练（FIFA 11+ 类），不是拉伸。以\"可忍受的拉伸感\"为界，风险可控。"},
 {mark:"💡",tag:"【强】",q:"⑤ 可优化空间",c:"抗阻训练也能增柔韧性（Meta g=0.63，高强度更佳）——建议加每周2-3次下肢抗阻；平台期可静态↔PNF↔动态互换\"解腻\"。"}
];
const CORE=[
 {t:"Optimising the Dose of Static Stretching to Improve Flexibility: A Systematic Review, Meta-analysis and Multivariate Meta-regression",meta:"Ingram LA 2025 · Sports Medicine · PMID 40180774",links:[["DOI","https://doi.org/10.1007/s40279-024-02143-9"],["PubMed","https://pubmed.ncbi.nlm.nih.gov/40180774/"]],tag:"剂量机制"},
 {t:"The Effect of Time and Frequency of Static Stretching on Flexibility of the Hamstring Muscles",meta:"Bandy WD 1997 · Physical Therapy · 30 秒剂量经典",links:[["DOI","https://doi.org/10.1093/ptj/77.10.1090"]],tag:"剂量经典"},
 {t:"Acute changes in hamstring flexibility: PNF versus static stretch in senior athletes",meta:"Feland JB 2001 · Physical Therapy in Sport",links:[["DOI","https://doi.org/10.1054/ptsp.2001.0076"]],tag:"PNF 对比"},
 {t:"The Effectiveness of PNF Versus Static Stretching on Increasing Hip-Flexion Range of Motion",meta:"Hwang J 2018 · Journal of Sport Rehabilitation",links:[["DOI","https://doi.org/10.1123/jsr.2016-0098"]],tag:"PNF 对比"},
 {t:"Comparison of post-isometric relaxation and active static stretching in improving hamstring flexibility: a randomized controlled trial",meta:"Scientific Reports 2026 · 7 秒收缩 + 15 秒拉伸 × 10 轮",links:[["DOI","https://doi.org/10.1038/s41598-026-52130-5"]],tag:"PIR RCT"}
];
const EV=[
 {id:24570599,t:"Sit-and-reach 效度 Meta（34 研究）——经典版优于改良版，估腘绳肌 rp=0.46-0.67",m:"Mayorga-Vega 2014 · J Sports Sci Med"},
 {id:40180774,t:"静态拉伸机制：ROM 改善主要来自拉伸耐受（神经适应），肌束长度无显著变化",m:"Ingram LA 2025 · Sports Med"},
 {id:37962709,t:"急性效应大 Meta（47 研究/110 效应量）：单次拉伸均改善，拉伸技术间无差异（P=0.72）",m:"Behm 2023 · Sports Med Open"},
 {id:39913497,t:"神经动力学 vs 静态：短期腘绳肌柔韧性 SMD=1.21，短期优于静态",m:"Núñez de Arenas-Arroyo 2025 · PLoS ONE"},
 {id:40469856,t:"动态/弹道拉伸急性效应 ES=0.372，热身动态摆腿有证据支持",m:"Matsuo 2025 · J Sports Sci Med"},
 {id:39787531,t:"抗阻训练增柔韧性 Meta（36 研究，g=0.63）：力量与柔韧性不冲突",m:"Favro 2025 · J Strength Cond Res"},
 {id:41408617,t:"PNF 膝伤康复剂量：8-12 周、每周 6 次、每次 10-30 分钟效果最佳",m:"Zhang 2025 · BMC Musculoskelet Disord"},
 {id:39787087,t:"PNF 踝不稳功能恢复证据",m:"Yin 2025 · PLoS ONE"},
 {id:40643578,t:"单次 20-200 秒/组与更优结局相关（时长下限线索）",m:"Guo 2025 · Ann Hum Biol"},
 {id:31629335,t:"肌筋膜远程效应（8 RCT）：筋膜链干预对 sit-and-reach 增益 1-3cm",m:"Burk 2020 · J Sport Rehabil"},
 {id:38459925,t:"PNF vs 静态（交叉 RCT）：改善不优于彼此",m:"Ficarra 2024 · Res Sports Med"},
 {id:39457334,t:"PNF vs 静态（RCT）：均改善后链活动度，不优于彼此",m:"Atac 2024 · IJERPH"},
 {id:40021055,t:"叠加振动可增柔韧性（65 研究），可选项非必需",m:"Jochum 2025 · J Sport Health Sci"},
 {id:35732343,t:"军人损伤预防 SR：结构化训练降 14% 损伤风险（证据等级 very low）",m:"Bunn 2024 · BMJ Mil Health"},
 {id:40177023,t:"足球损伤预防：结构化方案显著降严重损伤",m:"Moncer 2024 · F1000Res"},
 {id:40633262,t:"静态拉伸对胫骨应力综合征（MTSS）无预防作用——防伤分部位看",m:"Marques 2025 · Gait Posture"}
];
const ACTIONS=[
 "保持现状：6 动作组合 + 每日 15 分钟 + 每周自测——测量有效、剂量在区间、方法组合合理，无需推翻重来",
 "心理建设：后期进步变慢是「神经解锁 → 组织重塑」的机制切换（Ingram 2025），不是退步",
 "加量不加价：建议叠加每周 2-3 次下肢抗阻（靠墙静蹲 3×30s、坐姿抬腿、渐进北欧弯举）——直接增柔韧性且是更好的防伤方案",
 "平台期策略：急性效应技术间无差异 → 可静态↔PNF↔动态互换「解腻」，证据支持不减",
 "痛感边界：保持可忍受的拉伸感，出现尖锐刺痛即停；D0 笔记的「痛苦不堪」注意区分拉伸痛/损伤痛",
 "引用修正：计划文档「Ingram 2024」应指 Ingram LA 2025（PMID 40180774）；「每周10分钟最优」表述建议核实补充来源"
];
const LIMITS="检索覆盖 PubMed 英文文献，CNKI/Wanfang 未纳入；损伤风险主题的经典综述（Thacker 2004、Behm 2016 等）未被本轮检索式充分捕获；Ingram「每周10分钟」溯源未完全闭环；被引数据为 OpenAlex 快照；结论强度标注基于本报告评分卡，非 GRADE 官方评级。";

const html=document.documentElement;
html.dataset.theme=localStorage.getItem("flexplan.theme")||"dark";
document.getElementById("btn-theme").onclick=()=>{
  html.dataset.theme=html.dataset.theme==="dark"?"light":"dark";
  localStorage.setItem("flexplan.theme",html.dataset.theme);
};

document.getElementById("verdicts").innerHTML=VERDICTS.map(v=>
  '<div class="v-cell"><div class="v-top"><span class="v-mark">'+v.mark+'</span><span class="v-tag">'+v.tag+'</span></div><div class="v-q">'+v.q+'</div><div class="v-c">'+v.c+'</div></div>').join("");
document.getElementById("core-refs").innerHTML=CORE.map((r,i)=>
  '<div class="ref"><div class="ref-idx">0'+(i+1)+'</div><div class="ref-body"><div class="ref-title">'+r.t+'</div>'+
  '<span class="ref-meta">'+r.meta+'</span><div class="ref-links">'+r.links.map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>').join("")+'</div></div>'+
  '<span class="grp-tag">'+r.tag+'</span></div>').join("");
document.getElementById("ev-refs").innerHTML=EV.map((r,i)=>
  '<div class="ref"><div class="ref-idx">'+(i+1)+'</div><div class="ref-body"><div class="ref-title">'+r.t+'</div>'+
  '<span class="ref-meta">'+r.m+'</span><div class="ref-links"><a href="https://pubmed.ncbi.nlm.nih.gov/'+r.id+'/" target="_blank" rel="noopener">PMID '+r.id+'</a></div></div></div>').join("");
document.getElementById("actions").innerHTML=ACTIONS.map((a,i)=>
  '<div class="sug"><div class="n">'+(i+1)+'</div><div>'+a+'</div></div>').join("");
document.getElementById("limits").textContent=LIMITS;
</script>
</body>
</html>
